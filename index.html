<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tree Lifecycle Zen</title>
<meta name="description" content="The life of a persimmon tree, painted in the manner of Japanese ink-wash and woodblock prints. Seed, sapling, seasons, fruit, decay and seed again, looping forever.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@400;600&family=Yuji+Syuku&display=swap">
<style>
  /* Layout: one full-bleed painted scene; a small colophon of controls along the lower edge */
  :root {
    --washi: #efe6d2;                    /* paper */
    --washi-veil: rgba(239, 230, 210, 0.82);
    --sumi: #231f1c;                     /* ink */
    --sumi-faint: rgba(35, 31, 28, 0.3);
    --shu: #b8402c;                      /* seal vermilion */
    --font-brush: "Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
    --font-text: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", Georgia, serif;
    color-scheme: light;
  }
  html, body { height: 100%; margin: 0; }
  body { background: var(--washi); color: var(--sumi); overflow: hidden; font-family: var(--font-text); }
  #scene, #paper { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #scene { touch-action: manipulation; }
  #paper { mix-blend-mode: multiply; pointer-events: none; }
  .controls {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    display: flex; flex-wrap: wrap; justify-content: center; gap: 6px;
    width: max-content; max-width: calc(100% - 32px);
    transition: opacity 0.6s ease;
  }
  .controls.idle { opacity: 0; }
  .controls.idle:focus-within { opacity: 1; }
  .controls button {
    font: 13px/1.2 var(--font-text); letter-spacing: 0.02em; color: var(--sumi);
    background: var(--washi-veil); border: 1px solid var(--sumi-faint); border-radius: 2px;
    padding: 6px 11px; cursor: pointer;
  }
  .controls button:hover { border-color: var(--sumi); }
  .controls button:focus-visible { outline: 2px solid var(--shu); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); clip-path: inset(50%); white-space: nowrap; }
  @media (prefers-reduced-motion: reduce) { .controls { transition: none; } }
</style>
</head>
<body>
<canvas id="scene" role="img" aria-label="An ink-painted persimmon tree grows from a seed, lives through many seasons, bears fruit, and returns a seed to the soil, over and over."></canvas>
<canvas id="paper" aria-hidden="true"></canvas>
<nav class="controls" id="controls" aria-label="Animation controls">
  <button type="button" id="btnPlay">Pause</button>
  <button type="button" id="btnTempo">Tempo 1×</button>
  <button type="button" id="btnEnding">Ending: both in turn</button>
  <button type="button" id="btnText">Inscriptions on</button>
</nav>
<p class="sr-only" id="live" aria-live="polite"></p>
<script>
/* ==========================================================================
   Tree Lifecycle Zen
   A persimmon (kaki) tree, painted as it lives: seed, sprout, sapling, the
   turning seasons, the eighth-year fruit, the last fruit left on the bough,
   decay, and the seed returning to the soil. Then the wheel turns again.

   Every frame is a pure function of the clock T, so pausing, tempo changes
   and jumping (?t=seconds) never drift out of step.
   ========================================================================== */
(() => {
'use strict';

/* ------------------------------------------------------------------ maths */
const TAU = Math.PI * 2, HALF_PI = Math.PI / 2;
const clamp = (x, a, b) => (x < a ? a : x > b ? b : x);
const sat = x => (x < 0 ? 0 : x > 1 ? 1 : x);
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = sat(t); return t * t * (3 - 2 * t); };
const sstep = (a, b, x) => smooth((x - a) / (b - a));
const band = (x, a, b, c, d) => sstep(a, b, x) * (1 - sstep(c, d, x));
const easeInOut = t => { t = sat(t); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const easeIn = t => { t = sat(t); return t * t; };
const easeOut = t => { t = sat(t); return 1 - (1 - t) * (1 - t); };
const angWrap = a => { while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; };

function hashU(n) {
  n = Math.imul(n ^ (n >>> 16), 0x7feb352d);
  n = Math.imul(n ^ (n >>> 15), 0x846ca68b);
  return ((n ^ (n >>> 16)) >>> 0) / 4294967296;
}
const h2 = (a, b) => hashU(Math.imul(a | 0, 0x27d4eb2d) ^ Math.imul((b | 0) + 0x165667b1, 0x9e3779b1));
function rngOf(seed) {
  let a = seed >>> 0;
  return () => {
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function vnoise(x, s) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(h2(i, s), h2(i + 1, s), u); }
function fbm(x, s, oct = 4) {
  let sum = 0, amp = 0.5, fr = 1, norm = 0;
  for (let k = 0; k < oct; k++) { sum += amp * vnoise(x * fr, s + k * 131); norm += amp; amp *= 0.5; fr *= 2.03; }
  return sum / norm;
}
function interp(tb, x) {
  if (x <= tb[0][0]) return tb[0][1];
  for (let i = 1; i < tb.length; i++) if (x <= tb[i][0]) { const a = tb[i - 1], b = tb[i]; return lerp(a[1], b[1], (x - a[0]) / (b[0] - a[0])); }
  return tb[tb.length - 1][1];
}
function bez(P, u) {
  const v = 1 - u, a = v * v * v, b = 3 * v * v * u, c = 3 * v * u * u, d = u * u * u;
  return [a * P[0][0] + b * P[1][0] + c * P[2][0] + d * P[3][0], a * P[0][1] + b * P[1][1] + c * P[2][1] + d * P[3][1]];
}

/* ---------------------------------------------------------------- palette */
const hex = s => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const rgba = (c, a = 1) => 'rgba(' + (c[0] | 0) + ',' + (c[1] | 0) + ',' + (c[2] | 0) + ',' + (a <= 0 ? 0 : a >= 1 ? 1 : a.toFixed(3)) + ')';

// traditional pigments: sumi ink, shu vermilion, kaki-iro persimmon, moegi sprout green, momiji maple red …
const C = {
  paper: hex('#efe6d2'),
  ink: hex('#1d1916'), inkMid: hex('#332c27'), inkSoft: hex('#5f5750'), inkPale: hex('#a0968b'),
  stem: hex('#93a65a'), barkYoung: hex('#6a5844'),
  shu: hex('#b8402c'),
  kaki: hex('#de6524'), kakiYellow: hex('#e6a537'), kakiGreen: hex('#8e9b3f'), rotBrown: hex('#7a4422'), rotDark: hex('#3a2a1d'),
  wakaba: hex('#c6cf6c'), moegi: hex('#a3bb4f'), midori: hex('#5a7838'), fukami: hex('#3f5a2f'),
  momiji: hex('#b02e27'), beni: hex('#c4452b'), daidai: hex('#d8782d'), kincha: hex('#d09a34'), kuchiba: hex('#a7733d'),
  flower: hex('#efe3b0'),
  snow: hex('#fbf8f2'), snowShade: hex('#b3b9c0'),
  earth: hex('#7d6046'), earthDeep: hex('#4e3b2c'), moss: hex('#6b7d2f'),
  ai: hex('#2c4863'), fuji: hex('#5c7088'),
  seed: hex('#5c3b22'), seedRim: hex('#8d5c33'), root: hex('#e2d7bc'), sprout: hex('#e6dfb8'),
  crow: hex('#13110f'), mushroom: hex('#8a5a3a'),
};
const AUTUMN = [C.momiji, C.beni, C.daidai, C.kincha, C.beni, C.daidai, C.momiji];

// cyclic seasonal ramps over the year fraction f (0 = first breath of spring)
function ramp(stops, f) {
  const n = stops.length;
  if (f < stops[0][0]) f += 1;
  for (let i = 0; i < n; i++) {
    const a = stops[i], b = stops[(i + 1) % n], fa = a[0], fb = i + 1 < n ? b[0] : b[0] + 1;
    if (f >= fa && f < fb) return mix(a[1], b[1], smooth((f - fa) / (fb - fa)));
  }
  return stops[n - 1][1];
}
function rampN(stops, f) {
  const n = stops.length;
  if (f < stops[0][0]) f += 1;
  for (let i = 0; i < n; i++) {
    const a = stops[i], b = stops[(i + 1) % n], fa = a[0], fb = i + 1 < n ? b[0] : b[0] + 1;
    if (f >= fa && f < fb) return lerp(a[1], b[1], smooth((f - fa) / (fb - fa)));
  }
  return stops[n - 1][1];
}
const SKY = [[0.02, hex('#efc6ad')], [0.17, hex('#a9c3d3')], [0.36, hex('#86aecb')], [0.55, hex('#e7bd85')], [0.68, hex('#d8a878')], [0.8, hex('#9ea3ab')], [0.93, hex('#b4adb1')]];
const SKY_A = [[0.02, 0.42], [0.36, 0.55], [0.6, 0.5], [0.85, 0.62]];
const SUN = [[0.06, hex('#de5f43')], [0.34, hex('#cc3a24')], [0.58, hex('#f1e0b0')], [0.84, hex('#ebe6dc')]];
const SUN_A = [[0.06, 0.78], [0.34, 0.9], [0.58, 0.96], [0.84, 0.9]];
const MOON = [[0.06, 0], [0.46, 0], [0.55, 1], [0.7, 1], [0.8, 0.5], [0.95, 0]];
const GRASS = [[0.05, hex('#b4c264')], [0.3, hex('#6d8a3e')], [0.55, hex('#b18e47')], [0.72, hex('#9b7a4a')], [0.9, hex('#a39680')]];
const GRASS_H = [[0, 0.35], [0.15, 0.95], [0.45, 1], [0.7, 0.9], [0.88, 0.55]];
const HILL = [[0.05, hex('#58664c')], [0.35, hex('#4b5e44')], [0.6, hex('#6c5a45')], [0.85, hex('#6d7177')]];
const FUJI_SNOW = [[0.02, 0.6], [0.35, 0.86], [0.55, 0.8], [0.8, 0.52]];

/* --------------------------------------------------------------- timeline
   Each cycle maps real seconds (tau) to Y, the tree's age in years.
   Y < 0 is the seed's last winter; the fractional part of Y is the season. */
const WARP = [0, 0.25, 0.45, 0.8, 1];     // spring, summer, a lingering autumn, winter
const YEAR_S = 4.8;                        // seconds for an ordinary year
function makeTimeline(variant) {
  const K = [[0, -0.2], [7, -0.02], [14, 0.2], [15.2, 0.25], [16.6, 0.5], [18.8, 0.75], [20.2, 1]];
  let t = 20.2;
  const year = (y, dur, w) => { for (let i = 1; i <= 4; i++) K.push([t + w[i] * dur, y + i * 0.25]); t += dur; };
  for (let y = 1; y < 7; y++) year(y, YEAR_S, WARP);           // years 2–7
  year(7, 8.4, [0, 0.15, 0.29, 0.86, 1]);                      // year 8: the first fruit
  for (let y = 8; y < 11; y++) year(y, YEAR_S, WARP);          // the long middle years
  K.push([t + 1.5, 11.25], [t + 2.8, 11.5], [t + 7.8, 11.68], [t + 9.8, 11.7]);   // the last autumn
  t += 9.8;
  const E = { kima: t };
  if (variant === 'fall') {
    E.drop = t + 2.6; E.land = E.drop + 1.35; E.end = t + 17.5;
    K.push([E.drop, 11.705], [E.land, 11.71], [E.end, 11.8]);
  } else {
    E.arrive = t + 1.8; E.perch = t + 3.6; E.takeoff = t + 7.2; E.poop = t + 14.2; E.seedLand = E.poop + 1.6; E.end = t + 21.5;
    K.push([E.takeoff, 11.71], [E.poop, 11.745], [E.seedLand, 11.755], [E.end, 11.8]);
  }
  return { variant, K, E, dur: E.end };
}
const TIMELINES = { fall: makeTimeline('fall'), bird: makeTimeline('bird') };
function lookup(K, v, ci, co) {
  const n = K.length;
  if (v <= K[0][ci]) return K[0][co];
  if (v >= K[n - 1][ci]) return K[n - 1][co];
  let lo = 0, hi = n - 1;
  while (hi - lo > 1) { const m = (lo + hi) >> 1; if (K[m][ci] <= v) lo = m; else hi = m; }
  const a = K[lo], b = K[hi];
  return lerp(a[co], b[co], (v - a[ci]) / (b[ci] - a[ci]));
}
const yAt = (TL, t) => lookup(TL.K, t, 0, 1);
const tAt = (TL, y) => lookup(TL.K, y, 1, 0);

/* ------------------------------------------------------------------ world */
function groundY(x) { return 5 * (fbm(x * 0.0035, 31, 3) - 0.5) + 1.6 * (vnoise(x * 0.03, 32) - 0.5); }

/* ------------------------------------------------------------------- tree
   Branches are chains of segments. Each limb is born at an age and grows in
   proportion with the whole tree, so the crown keeps its shape as it swells;
   widths follow the pipe model (cross section proportional to the foliage
   carried above). */
const DEPTHS = [null,
  { segs: 6, len: [150, 230], spread: [0.62, 1.1], zig: 0.26, trop: 0.1, kid: 0.7, fork: 2 },
  { segs: 4, len: [66, 110], spread: [0.5, 1.0], zig: 0.34, trop: 0.08, kid: 0.7, fork: 2 },
  { segs: 3, len: [26, 44], spread: [0.5, 1.0], zig: 0.38, trop: 0.05, kid: 0.55, fork: 1 },
  { segs: 1, len: [10, 18], spread: [0.55, 1.1], zig: 0.3, trop: 0.04, kid: 0, fork: 0 }];
const FLEX = [0.1, 0.45, 0.9, 1.5, 2.1];
const WK = 0.86, RHO = 1 / 20;
const GROWTH = [[1, 0], [2, 0.06], [3, 0.14], [4, 0.24], [5, 0.35], [6, 0.47], [7, 0.58], [8, 0.69], [9, 0.79], [10, 0.88], [11, 0.95], [12, 1]];
const EARLY = [[0.02, 0], [0.07, 5], [0.12, 6.5], [0.2, 10], [0.5, 16], [1, 23]];   // the seedling's stem, in world units
const HANDOFF = [3.4, 5.6, 7.8];   // ages at which the main axes hand their foliage over to the twigs
const NCO = 20;                     // leaf cohorts

class Tree {
  constructor(seed, x0) {
    this.seed = seed >>> 0;
    this.x0 = x0;
    this.y0 = groundY(x0);
    const R = rngOf(this.seed);
    this.R = R;
    this.chains = []; this.leaves = []; this.fruits = []; this.roots = [];
    this.trunkLen = 250 + R() * 60;
    this.lean = (R() - 0.5) * 0.4;
    this.env = { cx: this.lean * 120, cy: 285 + R() * 40, rx: 255 + R() * 60, ry: 175 + R() * 40, s: (R() * 1e5) | 0 };
    this.buildTrunk(R);
    for (const c of this.chains) {
      if (!c.rough.length) for (let i = 0; i <= c.len.length; i++) c.rough.push((R() - 0.5) * 0.3, (R() - 0.5) * 0.3);
      c.deadEff = c.parent < 0 ? c.deadAge : Math.min(c.deadAge, this.chains[c.parent].deadEff);
      const n = c.rx.length;
      c.px = new Float32Array(n); c.py = new Float32Array(n); c.rot = new Float32Array(n);
      c.w = new Float32Array(n); c.mass = new Float32Array(n); c.add = new Float32Array(n);
      c.vis = 0; c.sc = 0; c.local = 0; c.total = c.dist[n - 1] - c.dist[0]; c.dots = [];
    }
    this.byDepth = [[], [], [], [], []];
    for (const c of this.chains) this.byDepth[c.depth].push(c);
    this.buildLeaves(R);
    this.buildRoots(R);
    this.makeProfile();
  }

  chain(parent, at, depth, x, y, d0) {
    const c = { i: this.chains.length, parent, at, depth, ang: [], len: [], rx: [x], ry: [y], dist: [d0], kids: [], rough: [], phase: this.R() * TAU, deadAge: Infinity, birth: 0, dur: 1 };
    this.chains.push(c);
    if (parent >= 0) this.chains[parent].kids.push(c.i);
    return c;
  }
  seg(c, a, L) {
    const n = c.rx.length - 1;
    c.ang.push(a); c.len.push(L);
    c.rx.push(c.rx[n] + Math.cos(a) * L); c.ry.push(c.ry[n] + Math.sin(a) * L); c.dist.push(c.dist[n] + L);
  }
  // distance from (x,y) along heading a to the (noisy) crown envelope
  reach(x, y, a) {
    const e = this.env, nf = 0.8 + 0.4 * vnoise(a * 1.6 + 7, e.s);
    const rx = e.rx * nf, ry = e.ry * nf;
    const px = (x - e.cx) / rx, py = (y - e.cy) / ry, ux = Math.cos(a) / rx, uy = Math.sin(a) / ry;
    const A = ux * ux + uy * uy, B = 2 * (px * ux + py * uy), Cc = px * px + py * py - 1;
    const disc = B * B - 4 * A * Cc;
    return disc < 0 ? 0 : Math.max(0, (-B + Math.sqrt(disc)) / (2 * A));
  }
  buildTrunk(R) {
    const c = this.chain(-1, 0, 0, 0, 0, 0);
    const segs = 9;
    let a = HALF_PI + (R() - 0.5) * 0.12;
    for (let i = 0; i < segs; i++) {
      const target = HALF_PI + this.lean * (0.3 + 0.9 * i / segs);
      a += (target - a) * 0.35 + (R() - 0.5) * 0.26;
      this.seg(c, a, (this.trunkLen / segs) * (0.8 + R() * 0.4));
    }
    let side = R() < 0.5 ? -1 : 1;
    for (let i = 2; i <= segs; i++) {
      const n = i === segs ? 2 : (R() < (i === 2 ? 0.35 : 0.62) ? 1 : 0);
      for (let j = 0; j < n; j++) { this.branch(c, i, side, 1, R, i / segs, i === segs && j === 0); side = -side; }
    }
  }
  branch(p, at, side, depth, R, hf = 0.5, leader = false) {
    const cfg = DEPTHS[depth];
    let a = p.ang[at - 1] + side * (leader ? 0.12 + R() * 0.25 : lerp(cfg.spread[0], cfg.spread[1], R()));
    a += (HALF_PI - a) * cfg.trop;
    if (Math.sin(a) < -0.3) a = Math.cos(a) >= 0 ? -0.3 : Math.PI + 0.3;
    const x = p.rx[at], y = p.ry[at];
    let L = lerp(cfg.len[0], cfg.len[1], R());
    if (depth === 1) L *= leader ? 0.75 : 1.1 - 0.45 * hf;
    L = Math.max(L * 0.3, Math.min(L, this.reach(x, y, a) * (0.88 + R() * 0.22)));
    const c = this.chain(p.i, at, depth, x, y, p.dist[at]);
    const pos = at / p.ang.length;
    if (depth === 1) { c.birth = 0.7 + 2.0 * pos * (0.6 + 0.4 * R()); c.dur = 2.6; }
    else if (depth === 2) { c.birth = p.birth + 0.8 + 1.4 * pos + R() * 0.5; c.dur = 2.2; }
    else if (depth === 3) { c.birth = p.birth + 0.6 + 1.0 * pos + R() * 0.4; c.dur = 1.6; }
    else { c.birth = p.birth + 0.5 + 0.7 * pos + R() * 0.3; c.dur = 1.0; }
    const out = Math.cos(a) >= 0 ? 1 : -1;
    let aa = a;
    for (let i = 0; i < cfg.segs; i++) {
      if (depth === 1 && !leader) aa += ((HALF_PI - out * 0.95) - aa) * 0.1;
      aa += (R() - 0.5) * cfg.zig;
      this.seg(c, aa, (L / cfg.segs) * (0.75 + R() * 0.5));
    }
    for (let i = 0; i <= cfg.segs; i++) c.rough.push((R() - 0.5) * 0.3, (R() - 0.5) * 0.3);
    if ((depth === 2 || depth === 3) && R() < 0.1) c.deadAge = 9.6 + R() * 2.2;   // old age claims a few limbs
    if (depth < 4) {
      let s = R() < 0.5 ? -1 : 1;
      for (let i = 1; i <= cfg.segs; i++) {
        const n = i === cfg.segs ? cfg.fork : 1;
        for (let j = 0; j < n; j++) if (R() < cfg.kid) { this.branch(c, i, s, depth + 1, R); s = -s; }
      }
    }
    return c;
  }
  locate(c, d) {
    for (let s = 0; s < c.len.length; s++) { if (d <= c.len[s]) return { s, t: d / c.len[s] }; d -= c.len[s]; }
    return { s: c.len.length - 1, t: 1 };
  }
  buildLeaves(R) {
    // leaves belong to cohorts that bud, turn and fall together; each cohort is one brush load of colour
    this.cohorts = [];
    for (let i = 0; i < NCO; i++) {
      const fo = R();
      this.cohorts.push({ bud: R(), turn: R(), fo, fallF: 0.62 + fo * 0.09, hue: R() - 0.5, autumn: AUTUMN[(R() * AUTUMN.length) | 0] });
    }
    const add = (c, s, t, side, size, juvenile) => this.leaves.push({
      c: c.i, s, t, side, size, juvenile, d: c.dist[s] + t * c.len[s],
      spread: 0.55 + R() * 0.55, back: R() < 0.32, co: (R() * NCO) | 0, ph: R() * TAU, fj: (R() - 0.5) * 0.05,
      drift: R() - 0.5, spin: (R() < 0.5 ? -1 : 1) * (1.2 + R() * 2.2), lie: (R() - 0.5) * 0.9,
    });
    for (const c of this.chains) {
      const ns = c.len.length;
      let side = R() < 0.5 ? -1 : 1;
      if (c.depth >= 3) {
        for (let s = 0; s < ns; s++) if (R() < 0.75) { add(c, s, 0.35 + R() * 0.5, side, 15 + R() * 6, false); side = -side; }
        const nt = 2 + (R() < 0.45 ? 1 : 0);
        for (let j = 0; j < nt; j++) { add(c, ns - 1, 0.9 + R() * 0.1, side, 14 + R() * 6, false); side = -side; }
      } else {
        // juvenile foliage that follows the growing tip of the main axes
        let d = c.depth === 0 ? 5.6 : 4, k = 0;

const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const FONT_BRUSH = '"Yuji Syuku", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", "IPAMincho", serif';

function makePaper(w, h) {
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0, 0, w, h);
  // soft mottling: a coarse random field, enlarged
  const cell = 46, sw = Math.ceil(w / cell) + 3, sh = Math.ceil(h / cell) + 3;
  const small = document.createElement('canvas'); small.width = sw; small.height = sh;
  const sg = small.getContext('2d'), id = sg.createImageData(sw, sh);
  for (let i = 0; i < sw * sh; i++) { const v = 238 + Math.random() * 17; id.data[i * 4] = v; id.data[i * 4 + 1] = v - 2; id.data[i * 4 + 2] = v - 8; id.data[i * 4 + 3] = 255; }

  for (let i = 0; i < d.length; i += 4) { const n = (Math.random() - 0.5) * 9; d[i] += n; d[i + 1] += n; d[i + 2] += n; }

  // kozo fibres
  g.lineCap = 'round';
  const count = Math.round(w * h / 2200);
  for (let i = 0; i < count; i++) {
    const x = Math.random() * w, y = Math.random() * h, len = 6 + Math.random() * 38, a = Math.random() * TAU, bend = (Math.random() - 0.5) * 1.4;
    g.strokeStyle = 'rgba(135,115,85,' + (0.035 + Math.random() * 0.07).toFixed(3) + ')';
    g.lineWidth = 0.35 + Math.random() * 0.7;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + bend) * len * 0.5, y + Math.sin(a + bend) * len * 0.5, x + Math.cos(a) * len, y + Math.sin(a) * len);

function makeSeal(size) {
  const cv = document.createElement('canvas');
  const sw = size * 0.8, sh = size;
  cv.width = Math.ceil(sw * DPR) + 2; cv.height = Math.ceil(sh * DPR) + 2;
  const g = cv.getContext('2d'); g.scale(DPR, DPR);
  const R = rngOf(1013);
  g.beginPath();
  const pts = [];
  const edge = (x0, y0, x1, y1, n) => { for (let i = 0; i < n; i++) { const u = i / n; pts.push([lerp(x0, x1, u) + (R() - 0.5) * 1.3, lerp(y0, y1, u) + (R() - 0.5) * 1.3]); } };

  pts.forEach((p, i) => (i ? g.lineTo(p[0], p[1]) : g.moveTo(p[0], p[1])));

function resize() {
  W = Math.max(1, window.innerWidth); H = Math.max(1, window.innerHeight);
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  if (W * H * DPR * DPR > 5.5e6) DPR = Math.sqrt(5.5e6 / (W * H));
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
  S = Math.min(H / 900, W / 700);
  VIS_H = H / S;
  GF_FULL = 0.98 - 135 * S / H;
  SUN_R = Math.min(W, H) * 0.068;
  SUN_X = Math.max(W * 0.2, SUN_R * 1.9);
  SUN_Y = Math.max(Math.min(H * 0.23, (GF_FULL * H) * 0.3), SUN_R * 1.7);
  // the washi lies over everything as its own layer, multiplied by the compositor
  const pt = makePaper(Math.round(W), Math.round(H));
  paperEl.width = pt.width; paperEl.height = pt.height;

  sealTex = null;
}

const setScreen = () => ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
function setWorld(cam) {
  const k = S * cam.z;

}

window.addEventListener('pointerdown', wake, { passive: true });
window.addEventListener('keydown', e => {
  if (e.target && e.target.tagName === 'BUTTON' && (e.key === ' ' || e.key === 'Enter')) return;
  if (e.key === ' ') { playing = !playing; e.preventDefault(); }
  else if (e.key === 'ArrowRight') tempoI = Math.min(2, TEMPOS[tempoI] === 0.5 ? 0 : tempoI + 1);
  else if (e.key === 'ArrowLeft') tempoI = TEMPOS[tempoI] === 1 ? 3 : TEMPOS[tempoI] === 0.5 ? 3 : tempoI - 1;
  else if (e.key === 'e' || e.key === 'E') setMode(mode === 'alt' ? 'fall' : mode === 'fall' ? 'bird' : 'alt');
  else if (e.key === 'c' || e.key === 'C') showText = !showText;
  else return;
  syncUI(); wake();
});
if (reduceMQ && reduceMQ.addEventListener) reduceMQ.addEventListener('change', e => { reduceMotion = e.matches; });
syncUI(); wake();
if (document.fonts && document.fonts.load) {
  const chars = Object.values(CAP).map(v => v[0]).join('') + KANJI_NUM.join('') + SEASON_K.join('') + '年目・輪廻';
  Promise.all([document.fonts.load('48px "Yuji Syuku"', chars), document.fonts.load('16px "Shippori Mincho"', 'Aa' + chars), document.fonts.load('600 16px "Shippori Mincho"', '輪廻')])
    .then(() => { sealTex = null; }).catch(() => {});
}

// hooks for automated screenshots: render any moment on demand
window.__tlz = {
  render: t => { T = t; render(T); },
  info: () => { const c = cycleAt(T); return { k: c.k, variant: c.variant, start: c.start, dur: c.dur, E: c.TL.E, x: c.x, landX: c.landX }; },
};
requestAnimationFrame(loop);
})();
